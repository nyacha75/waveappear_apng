<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG & 코코포리아 파도 메이커</title>
    <script src="https://unpkg.com/upng-js@2.1.0/UPNG.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-color: #f5f3ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .app-container {
            background-color: var(--card-bg); width: 100%; max-width: 800px;
            padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1); text-align: center;
        }
        .header h1 { font-size: 2.2rem; color: var(--primary); margin-bottom: 10px; }
        .header p { color: var(--text-muted); font-size: 1rem; margin-bottom: 25px; line-height: 1.5; }
        
        .controls {
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px;
            background: #f8fafc; padding: 20px; border-radius: 12px;
        }
        .control-group { display: flex; flex-direction: column; text-align: left; gap: 8px; flex: 1; min-width: 150px; }
        .control-group label { font-weight: 600; font-size: 0.9rem; }
        .control-group select, .control-group input {
            padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1;
            font-size: 1rem; outline: none; background: white; width: 100%;
        }
        .range-slider { display: flex; align-items: center; gap: 10px; }
        .range-slider input { flex: 1; cursor: pointer; }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 14px 28px; font-size: 1rem; font-weight: 600;
            border-radius: 12px; cursor: pointer; border: none; transition: all 0.2s;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-primary:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; }

        .status-area { display: none; margin: 20px 0; padding: 25px; background-color: #f8fafc; border-radius: 16px; }
        .status-text { font-weight: 600; color: var(--primary); margin-bottom: 15px; font-size: 1.1rem; }
        .progress-wrapper { width: 100%; height: 10px; background-color: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #a78bfa, #8b5cf6); transition: width 0.1s ease; }
        
        .canvas-wrapper {
            display: inline-block; padding: 10px; border-radius: 12px; width: 100%;
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e8f0 75%), linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; box-shadow: inset 0 0 0 2px #cbd5e1;
        }
        canvas, #previewImage { max-width: 100%; height: auto; border-radius: 8px; margin: 0 auto; display: block; }
        #previewImage { display: none; }
        
        .result-area { display: none; margin-top: 30px; }
        .result-area h3 { margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🎲 코코포리아 파도 메이커</h1>
        <p>어떤 큰 이미지를 넣어도 코코포리아 용량에 맞게 자동으로 최적화해줍니다.<br>애니메이션(APNG)과 정지(WebP)를 모두 지원합니다.</p>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="formatSelect">출력 포맷 (기본 APNG)</label>
            <select id="formatSelect">
                <option value="apng">🖼️ APNG (애니메이션 / 기본)</option>
                <option value="webp_static">🖼️ WebP (단일 정지 이미지)</option>
                <option value="webp_zip">📦 WebP (애니메이션 프레임 ZIP)</option>
            </select>
        </div>
        
        <div class="control-group" id="limitGroup">
            <label for="limitSelect">자동 용량 맞춤 (APNG 전용)</label>
            <select id="limitSelect">
                <option value="10">코코포리아 프로 (10MB 이하로 자동 압축)</option>
                <option value="1">코코포리아 무료 (1MB 이하로 자동 압축)</option>
                <option value="999">제한 없음 (원본 화질 강제 유지)</option>
            </select>
        </div>

        <div class="control-group" id="staticProgressGroup" style="display: none;">
            <label for="staticProgress">파도 위치 (정지 화면 캡처용)</label>
            <div class="range-slider">
                <input type="range" id="staticProgress" min="0" max="100" value="50">
                <span id="staticProgressValue">50%</span>
            </div>
        </div>

        <div class="control-group">
            <label for="directionSelect">파도 방향</label>
            <select id="directionSelect">
                <option value="left">좌측 ➔ 우측</option>
                <option value="right">우측 ➔ 좌측</option>
                <option value="top">상단 ➔ 하단</option>
                <option value="bottom">하단 ➔ 상단</option>
            </select>
        </div>

        <div class="control-group" id="holdTimeGroup">
            <label for="holdTime">완전 표시 유지 시간 (초)</label>
            <input type="number" id="holdTime" value="4" min="0" max="10" step="0.5">
        </div>
    </div>

    <div>
        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" style="display: none;">
        <label for="imageInput" class="btn btn-primary" id="uploadBtn">
            📁 투명 배경 이미지 선택하기
        </label>
    </div>

    <div class="status-area" id="statusArea">
        <div class="status-text" id="statusText">대기 중...</div>
        <div class="progress-wrapper"><div class="progress-bar" id="progressBar"></div></div>
        <div class="canvas-wrapper">
            <canvas id="animationCanvas"></canvas>
            <img id="previewImage" alt="결과 미리보기">
        </div>
    </div>

    <div class="result-area" id="resultArea">
        <h3>🎉 생성 완료!</h3>
        <button id="downloadBtn" class="btn btn-primary">💾 다운로드</button>
    </div>
</div>

<script>
    // UI 요소 변수 연결
    const formatSelect = document.getElementById('formatSelect');
    const limitGroup = document.getElementById('limitGroup');
    const staticProgressGroup = document.getElementById('staticProgressGroup');
    const holdTimeGroup = document.getElementById('holdTimeGroup');
    const staticProgressInput = document.getElementById('staticProgress');
    const staticProgressValue = document.getElementById('staticProgressValue');
    
    // 포맷 변경 시 메뉴 보이기/숨기기
    formatSelect.addEventListener('change', () => {
        const fmt = formatSelect.value;
        limitGroup.style.display = (fmt === 'apng') ? 'flex' : 'none';
        holdTimeGroup.style.display = (fmt === 'webp_static') ? 'none' : 'flex';
        staticProgressGroup.style.display = (fmt === 'webp_static') ? 'flex' : 'none';
    });

    staticProgressInput.addEventListener('input', (e) => {
        staticProgressValue.innerText = e.target.value + '%';
    });

    const imageInput = document.getElementById('imageInput');
    const directionSelect = document.getElementById('directionSelect');
    const limitSelect = document.getElementById('limitSelect');
    const holdTimeInput = document.getElementById('holdTime');
    
    const statusArea = document.getElementById('statusArea');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const previewImage = document.getElementById('previewImage');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const uploadBtn = document.getElementById('uploadBtn');

    let processedCanvas = document.createElement('canvas');
    let processedCtx = processedCanvas.getContext('2d');
    
    let finalBlob = null;
    let finalExt = 'png';

    const updateProgress = (msg, percent) => {
        statusText.innerText = msg;
        progressBar.style.width = `${percent}%`;
    };

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadBtn.style.pointerEvents = 'none';
        uploadBtn.innerText = "⏳ 렌더링 중입니다...";
        statusArea.style.display = 'block';
        resultArea.style.display = 'none';
        canvas.style.display = 'block';
        previewImage.style.display = 'none';

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                // APNG 인코딩 시작 전 기본 최대 해상도 제한 (800px)
                const MAX_SIZE = 800; 
                let w = img.width, h = img.height;
                if (w > MAX_SIZE || h > MAX_SIZE) {
                    const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
                    w = Math.round(w * ratio); h = Math.round(h * ratio);
                }
                
                processedCanvas.width = w; processedCanvas.height = h;
                processedCtx.drawImage(img, 0, 0, w, h);
                canvas.width = w; canvas.height = h;
                
                startProcess(w, h);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    async function startProcess(w, h) {
        const fmt = formatSelect.value;
        let angle = 0;
        
        switch(directionSelect.value) {
            case 'left': angle = 0; break;
            case 'right': angle = Math.PI; break;
            case 'top': angle = Math.PI / 2; break;
            case 'bottom': angle = -Math.PI / 2; break;
        }

        try {
            if (fmt === 'apng') {
                finalExt = 'png';
                finalBlob = await createAutoResizedAPNG(w, h, angle);
            } else if (fmt === 'webp_static') {
                finalExt = 'webp';
                finalBlob = await createStaticWebP(w, h, angle);
            } else {
                finalExt = 'zip';
                finalBlob = await createWebpZip(w, h, angle);
            }

            updateProgress(`✅ 작업 완료!`, 100);
            
            if (fmt !== 'webp_zip') {
                const url = URL.createObjectURL(finalBlob);
                canvas.style.display = 'none';
                previewImage.src = url;
                previewImage.style.display = 'block';
            }
            
            resultArea.style.display = 'block';
            downloadBtn.innerText = (fmt === 'webp_zip') ? '📦 프레임 ZIP 다운로드' : '💾 저장하기';

        } catch (error) {
            console.error(error);
            updateProgress(`❌ 오류 발생! 다시 시도해주세요.`, 0);
            statusText.style.color = 'red';
        } finally {
            uploadBtn.style.pointerEvents = 'auto';
            uploadBtn.innerText = "📁 다른 이미지 선택하기";
            imageInput.value = ''; 
        }
    }

    // 🖼️ 1. APNG (코코포리아 용량 자동 맞춤 알고리즘 적용)
    async function createAutoResizedAPNG(originalW, originalH, angle) {
        let targetMB = parseFloat(limitSelect.value);
        let maxBytes = targetMB * 1024 * 1024;
        let scale = 1.0;
        let attempt = 1;
        let bestBlob = null;

        while (true) {
            let sw = Math.round(originalW * scale);
            let sh = Math.round(originalH * scale);
            
            let frames = [];
            let delays = [];
            
            // 용량 절약을 위해 FPS를 15로 낮춤
            const FPS = 15; 
            const fadeFramesCount = Math.floor(FPS * 1.5); 
            const holdTimeSec = parseFloat(holdTimeInput.value) || 4;
            
            updateProgress(`🚀 APNG 렌더링 중... (해상도 ${sw}px, 시도 ${attempt}회)`, 30);
            await new Promise(r => setTimeout(r, 0));

            // 프레임 생성 루프
            for (let i = 0; i <= fadeFramesCount; i++) {
                drawScaledWave(sw, sh, angle, i / fadeFramesCount, true);
                frames.push(ctx.getImageData(0, 0, sw, sh).data.buffer);
                delays.push(1000 / FPS);
            }

            drawScaledWave(sw, sh, angle, 1, true); // 유지 프레임
            frames.push(ctx.getImageData(0, 0, sw, sh).data.buffer);
            delays.push(holdTimeSec * 1000);

            for (let i = 0; i <= fadeFramesCount; i++) {
                drawScaledWave(sw, sh, angle, i / fadeFramesCount, false);
                frames.push(ctx.getImageData(0, 0, sw, sh).data.buffer);
                delays.push(1000 / FPS);
            }

            ctx.clearRect(0, 0, sw, sh); // 투명 빈 화면
            frames.push(ctx.getImageData(0, 0, sw, sh).data.buffer);
            delays.push(500);
            
            updateProgress(`📦 APNG 압축 중... (용량이 맞는지 확인합니다)`, 80);
            await new Promise(r => setTimeout(r, 50));

            const apngBuffer = UPNG.encode(frames, sw, sh, 0, delays);
            bestBlob = new Blob([apngBuffer], { type: 'image/png' });

            // 10MB 밑으로 떨어졌거나, 무제한 옵션이거나, 너무 작아지면 루프 종료
            if (targetMB > 100 || bestBlob.size <= maxBytes || scale <= 0.3) {
                break;
            }

            // 실패 시 해상도를 20% 줄이고 다시 시도
            scale *= 0.8;
            attempt++;
        }
        
        return bestBlob;
    }

    // 📸 2. 단일 정지 WebP 이미지
    async function createStaticWebP(w, h, angle) {
        const progress = parseFloat(staticProgressInput.value) / 100;
        
        updateProgress(`📷 WebP 단일 정지 이미지 추출 중...`, 50);
        drawScaledWave(w, h, angle, progress, true);
        
        return new Promise(resolve => {
            canvas.toBlob(blob => {
                resolve(blob);
            }, 'image/webp', 1.0);
        });
    }

    // 📦 3. WebP 프레임 묶음 ZIP (ezgif 병합용)
    async function createWebpZip(w, h, angle) {
        const zip = new JSZip();
        const FPS = 15;
        const fadeFramesCount = Math.floor(FPS * 1.5);
        const holdFramesCount = Math.floor((parseFloat(holdTimeInput.value) || 4) * FPS);
        
        const totalFrames = (fadeFramesCount * 2) + holdFramesCount + 5;
        let currentFrameIdx = 0;

        const addWebPToZip = async () => {
            const dataUrl = canvas.toDataURL('image/webp', 1.0);
            const base64 = dataUrl.split(',')[1];
            const fileName = `frame_${String(currentFrameIdx).padStart(3, '0')}.webp`;
            zip.file(fileName, base64, {base64: true});
            
            currentFrameIdx++;
            updateProgress(`📷 프레임 추출 중...`, Math.min(99, Math.round((currentFrameIdx / totalFrames) * 90)));
            await new Promise(r => setTimeout(r, 0));
        };

        for (let i = 0; i <= fadeFramesCount; i++) {
            drawScaledWave(w, h, angle, i / fadeFramesCount, true); await addWebPToZip();
        }
        for (let i = 0; i < holdFramesCount; i++) {
            drawScaledWave(w, h, angle, 1, true); await addWebPToZip();
        }
        for (let i = 0; i <= fadeFramesCount; i++) {
            drawScaledWave(w, h, angle, i / fadeFramesCount, false); await addWebPToZip();
        }
        ctx.clearRect(0, 0, w, h);
        for(let i = 0; i < 5; i++) await addWebPToZip();

        updateProgress(`📦 ZIP 파일로 압축 중...`, 99);
        return await zip.generateAsync({type: "blob"});
    }

    // 🌊 파도 그리기 코어 함수
    function drawScaledWave(sw, sh, angle, progress, isFadingIn) {
        canvas.width = sw; canvas.height = sh;
        ctx.clearRect(0, 0, sw, sh);

        const diag = Math.sqrt(sw * sw + sh * sh);
        const amplitude = diag * 0.04;
        const freq = 0.03;

        ctx.save();
        ctx.translate(sw / 2, sh / 2);
        ctx.rotate(angle);

        const startX = -diag / 2 - amplitude * 2;
        const endX = diag / 2 + amplitude * 2;
        const waveX = startX + (endX - startX) * progress;

        ctx.beginPath();
        ctx.moveTo(waveX, -diag);

        for (let y = -diag; y <= diag; y += 5) {
            const xOffset = Math.sin(y * freq + (progress * 15)) * amplitude;
            ctx.lineTo(waveX + xOffset, y);
        }

        if (isFadingIn) {
            ctx.lineTo(-diag, diag); ctx.lineTo(-diag, -diag);
        } else {
            ctx.lineTo(diag, diag); ctx.lineTo(diag, -diag);
        }
        ctx.closePath();
        ctx.clip(); 

        ctx.rotate(-angle);
        ctx.translate(-sw / 2, -sh / 2);
        ctx.drawImage(processedCanvas, 0, 0, sw, sh);
        ctx.restore();
    }

    // 다운로드 실행
    downloadBtn.addEventListener('click', () => {
        if (!finalBlob) return;
        const url = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = url;
        
        let filename = 'cocofolia_wave';
        if (formatSelect.value === 'apng') filename += '.png';
        else if (formatSelect.value === 'webp_static') filename += '.webp';
        else filename += '_frames.zip';
        
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
